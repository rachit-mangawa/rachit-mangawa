name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: rachit-mangawa
          template: classic
          base: header, activity, community, repositories
          
          # Layout & Visual Config
          config_timezone: Asia/Kolkata
          config_display: large
          config_octicon: yes
          config_order: base.header, plugin.isocalendar, plugin.languages, base.activity, plugin.habits, plugin.followup, plugin.notable
          repositories_forks: no

          # Isometric Calendar (3D Commit Graph)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Languages (Clean GitHub colors + active stack focus)
          plugin_languages: yes
          plugin_languages_colors: github
          plugin_languages_sections: most-used
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 60
          plugin_languages_analysis_timeout_repositories: 15
          plugin_languages_categories: programming
          # plugin_languages_ignored: html, css, tex, less, makefile, cmake, shell, gnuplot, jupyter notebook
          plugin_languages_limit: 24
          plugin_languages_threshold: 0%
          plugin_languages_details: bytes-size, percentage

          # # Coding Habits (Active hours & day distribution)
          # plugin_habits: yes
          # plugin_habits_from: 200
          # plugin_habits_days: 14
          # plugin_habits_charts: yes
          # plugin_habits_facts: no

          # Lines of code (Injected into base header)
          plugin_lines: yes
          plugin_lines_sections: base

          # Follow-up (Open/Closed Issues & PRs)
          plugin_followup: yes
          plugin_followup_archived: no
          plugin_followup_sections: repositories, user

          # Notable Contributions
          plugin_notable: yes
          plugin_notable_from: all
          plugin_notable_skipped: mayanktyagi18122000/Gateway-Distriparks, pratistha09/Gateway-Distriparks
          plugin_notable_repositories: yes
          plugin_notable_types: commit, issue, pull_request
